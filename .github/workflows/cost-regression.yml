name: Cost Regression Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cost-regression:
    name: Eval Cost & Quality Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet

      - name: Download baseline artifact
        id: download_baseline
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: cost-regression.yml
          branch: main
          name: eval-baseline-v2
          path: baselines/
        continue-on-error: true   # First run has no baseline — skip gate

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ""
          MESHFLOW_MOCK: "1"
        run: |
          python -m pytest tests/ -q --tb=short \
            -m "not slow" \
            --no-header \
            -x
          # Offline mock metrics; failures must not become passing baselines.
          meshflow eval eval/ci_suite.yaml --fail-under 1.0 \
            --save-baseline eval_current.json

      - name: Run cost regression gate
        if: steps.download_baseline.outcome == 'success'
        run: |
          python -m meshflow.eval.ci_gate \
            --baseline baselines/eval_current.json \
            --current  eval_current.json \
            --max-token-regression  0.15 \
            --max-cost-regression   0.15 \
            --max-quality-regression 0.03

      - name: Upload new baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline-v2
          path: eval_current.json
          retention-days: 30
