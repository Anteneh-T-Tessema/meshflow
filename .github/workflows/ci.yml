name: CI

on:
  push:
    branches: [main, "sprint/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          # Ensure meshflow CLI is on PATH (pip user installs go to ~/.local/bin)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python -c "import sysconfig; print(sysconfig.get_path('scripts'))" >> "$GITHUB_PATH" || true

      - name: Debug environment
        run: |
          python --version
          which meshflow || echo "meshflow not in PATH"
          python -c "import meshflow; print('meshflow OK', meshflow.__version__)"
          python -c "import pytest_asyncio; print('pytest_asyncio', pytest_asyncio.__version__)"
          # Validate test collection (no asyncio-mode flag - let pyproject.toml handle it)
          MESHFLOW_MOCK=1 python -m pytest tests/ --collect-only -q \
            --ignore=tests/test_integration.py 2>&1 | tail -5

      - name: Run tests
        env:
          MESHFLOW_MOCK: "1"
          ANTHROPIC_API_KEY: ""
        run: |
          set -o pipefail
          python -m pytest tests/ --tb=short \
            --ignore=tests/test_integration.py \
            -x 2>&1 | tee /tmp/test_out.txt

      - name: Show test output on failure
        if: failure()
        run: |
          echo "## Test Failure (Python ${{ matrix.python-version }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -60 /tmp/test_out.txt >> "$GITHUB_STEP_SUMMARY" || echo "no output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^FAILED" /tmp/test_out.txt | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python-version }}
          path: /tmp/test_out.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: .pytest_cache/

  package:
    name: Installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel from source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip check
      - name: Verify installed runtime and durable audit
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed_wheel.py"

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . mypy
      - name: Check core contracts and governance session types
        run: |
          python -m mypy meshflow/core/schemas.py \
                        meshflow/security/api_keys.py \
                        meshflow/core/policy_loader.py \
                        meshflow/observability/otel_exporter.py \
                        meshflow/core/session.py \
                        meshflow/core/request_budget.py \
                        meshflow/streaming/sync_bridge.py \
                        meshflow/budget/reservations.py \
                        --follow-imports=silent \
                        --ignore-missing-imports \
                        --no-strict-optional


  benchmark:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e .
      - name: Run quick benchmark
        env:
          MESHFLOW_MOCK: "1"
        run: |
          python benchmarks/bench_core.py --concurrency 10 --quick \
            --output /tmp/bench_results.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/bench_results.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff==0.15.14
      - name: Run blocking repository lint
        run: python scripts/check_lint.py
      - name: Lint governance guarantees
        run: ruff check meshflow/core/session.py meshflow/core/request_budget.py meshflow/streaming/sync_bridge.py tests/test_governance_guarantees.py tests/test_governed_agent_modes.py tests/test_shared_reservations.py tests/test_worker_recovery.py tests/test_staging_boundaries.py scripts/validate_local_provider.py scripts/validate_cloud_provider.py tests/test_cloud_validation.py
